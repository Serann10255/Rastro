[project]
name = "rastro"
version = "0.1.0"
description = "Rastro: sistema de trazabilidad verificable de envios (microservicios)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "boto3>=1.34",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["libs", ".", "cotejo"]
testpaths = ["tests", "cotejo/tests"]
markers = ["e2e: pruebas de extremo a extremo contra la pila levantada"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "libs"}
packages = ["rastro_core"]
