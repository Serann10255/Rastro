# Servidor del sitio estático de Rastro.
#
# En AWS el sitio se sirve desde el almacenamiento de objetos y esta
# configuración no se despliega; existe para que el entorno local reproduzca dos
# comportamientos que la aplicación necesita.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con huella en el nombre no cambian nunca: se pueden cachear
    # indefinidamente. El índice y la configuración sí cambian.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La configuración se lee en tiempo de ejecución (REQ-09). Cachearla haría
    # que un traslado a otra cuenta no surtiera efecto hasta vaciar la caché.
    location = /configuracion.json {
        add_header Cache-Control "no-store";
    }

    # Aplicación de una sola página: cualquier ruta desconocida devuelve el
    # índice y el enrutador del cliente decide. Sin esto, recargar en
    # /envios/<id> o abrir un enlace compartido de /rastreo daría 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
