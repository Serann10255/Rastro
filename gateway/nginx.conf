# Puerta de enlace del entorno local: equivalente de Amazon API Gateway.
#
# Enruta por prefijo hacia el microservicio que corresponde. No valida el token
# aqui a proposito: el supuesto SU-01 del documento -que el laboratorio permite
# crear una interfaz HTTP con validador de tokens de Cognito- esta pendiente de
# confirmar, y la alternativa prevista es validar el token dentro de cada
# funcion. Como esa alternativa ya esta implementada, el sistema funciona con o
# sin validador en la puerta, y confirmar SU-01 solo anade una capa.
#
# Se usa API Gateway y no una URL de funcion porque la prueba preliminar de la
# Tabla 4 del documento mostro que la invocacion anonima de URL de funcion esta
# impedida por un control ajeno a la configuracion del recurso (RE-02).

server {
    listen 80;
    server_name _;

    # Resolucion de nombres en cada peticion, no al cargar la configuracion.
    # Sin esto, nginx fija la direccion de cada servicio al arrancar y sigue
    # enviando trafico a la direccion vieja cuando un contenedor se recrea: las
    # peticiones acaban en el microservicio equivocado, que responde 404 y hace
    # perder tiempo en un diagnostico falso.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # Endurecimiento del punto de entrada.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /salud {
        default_type application/json;
        return 200 '{"gateway":"rastro","estado":"activo"}';
    }

    location /auth/ {
        set $destino "auth:8000";
        proxy_pass http://$destino$request_uri;
    }

    location /publico/ {
        set $destino "publico:8000";
        proxy_pass http://$destino$request_uri;
    }

    location /bitacora {
        set $destino "bitacora:8000";
        proxy_pass http://$destino$request_uri;
    }

    # Las rutas de envio se reparten entre tres servicios segun el sufijo.
    # nginx evalua primero las expresiones regulares, de modo que estas dos
    # ganan sobre el prefijo /envios de mas abajo.
    location ~ ^/envios/[^/]+/(eventos|transiciones)$ {
        set $destino "rastreo:8000";
        proxy_pass http://$destino$request_uri;
    }

    location ~ ^/envios/[^/]+/evidencias {
        set $destino "evidencias:8000";
        proxy_pass http://$destino$request_uri;
    }

    location /envios {
        set $destino "envios:8000";
        proxy_pass http://$destino$request_uri;
    }
}
