# Servidor de las diapositivas compiladas.
#
# Tres páginas estáticas, no una aplicación de una sola página: no hay índice de
# respaldo, y una ruta desconocida es un 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `/rastro` → `/rastro/`, como el servidor de desarrollo. La redirección va
    # sin esquema ni puerto: el contenedor escucha en el 80 y se publica en el
    # 5177, y una dirección absoluta mandaría al navegador al puerto equivocado.
    # La almohadilla (`/rastro#7`) la conserva el navegador al seguirla.
    absolute_redirect off;

    # Los archivos con huella en el nombre no cambian nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Las páginas sí: tras reconstruir con un guion nuevo, recargar debe
    # mostrarlo sin vaciar la caché.
    location / {
        add_header Cache-Control "no-cache";
    }
}
